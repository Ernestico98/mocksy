services:
  mocksy:
    build:
      context: .
      args:
        WITH_EXPLAINER: ${WITH_EXPLAINER:-0}   # 1: also render "Model answer" videos (+~400 MB)
    image: mocksy
    ports:
      - "127.0.0.1:8765:8765"   # localhost only: browsers allow the microphone there without HTTPS
    environment:                # optional alternatives to `claude auth login`, read from your shell
      - CLAUDE_CODE_OAUTH_TOKEN
      - ANTHROPIC_API_KEY
    volumes:
      - ./data:/app/data                              # sessions, settings, personal packs (same folder as a native run)
      - models:/app/models                            # Kokoro voice model, fetched on first start
      - hf-cache:/home/mocksy/.cache/huggingface      # Whisper weights, fetched on first use
      - claude:/home/mocksy/.claude                   # Claude Code login and config
      - ./config.toml:/app/config.toml:ro             # edit models/voices without rebuilding
    restart: unless-stopped

volumes:
  models:
  hf-cache:
  claude:

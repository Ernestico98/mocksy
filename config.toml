# Defaults. Anything changed from the app's settings menu is saved to
# data/settings.json and takes precedence over this file.

[interviewer]
# Model aliases understood by the Claude Code CLI: "haiku", "sonnet", "opus", "fable"
# or a full model id.
model = "sonnet"          # runs the live conversation (fast + cheaper)
feedback_model = "opus"   # writes the final evaluation (slower, deeper)
feedback_language = "en"  # the evaluation is written in this language, whatever the interview language

[speech]
# Speech-to-text engine: "auto" uses mlx on Apple Silicon and faster-whisper elsewhere
# (NVIDIA GPU if available, otherwise CPU).
stt_engine = "auto"
whisper_model = "mlx-community/whisper-large-v3-turbo"  # mlx
faster_whisper_model = "small"                         # faster-whisper: ~1 s per turn on a CPU;
                                                        # "large-v3-turbo" with an NVIDIA GPU
speed = 1.0

[speech.voices]
en = "af_heart"
es = "em_alex"

[app]
host = "127.0.0.1"
port = 8765
data_dir = "data"
